<!doctype html>
<html lang="sq">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DMA Kçiq</title>
    <meta name="description" content="Paneli i zonës pilot DMA01 për Kçiq i Madh dhe Kçiq i Vogël, KRU Mitrovica" />
    <script>
      // A cached index.html from an older deploy names bundles that no longer exist, and the page
      // stays blank. If a bundle fails to load, reload once from a fresh URL that skips the cache.
      addEventListener('error', function (e) {
        var src = e.target && (e.target.src || e.target.href)
        if (!src || src.indexOf('/assets/') < 0) return
        try { if (sessionStorage.getItem('kciq-asset-reload')) return; sessionStorage.setItem('kciq-asset-reload', '1') } catch (_) {}
        var u = new URL(location.href); u.searchParams.set('v', Date.now()); location.replace(u)
      }, true)
      addEventListener('load', function () { setTimeout(function () { try { sessionStorage.removeItem('kciq-asset-reload') } catch (_) {} }, 5000) })
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
